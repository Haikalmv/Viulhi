<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Products | Viulhi Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="../favicon.ico" sizes="any" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="../apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css" />

  <!-- Design system (order matters) + portal -->
  <link rel="stylesheet" href="../css/tokens.css?v=202610291533" />
  <link rel="stylesheet" href="../css/base.css?v=202610291533" />
  <link rel="stylesheet" href="../css/components.css?v=202610291533" />
  <link rel="stylesheet" href="../css/admin.css?v=202610291533" />

  <!-- Loaded early (no defer) so the saved theme + brand colours apply before the page paints -->
  <script src="../js/theme.js?v=202610291533"></script>
  <script src="../js/config.js?v=202610291533" defer></script>
  <script src="../js/store-settings.js?v=202610291533" defer></script>
  <script src="../js/catalog.js?v=202610291533" defer></script>
  <script src="../js/cart.js?v=202610291533" defer></script>
  <script src="../js/product-card.js?v=202610291533" defer></script>
  <script src="../js/forms.js?v=202610291533" defer></script>
  <script src="../js/order-store.js?v=202610291533" defer></script>
  <script src="../js/file-store.js?v=202610291533" defer></script>
  <script src="../js/auth.js?v=202610291533" defer></script>
  <script src="../js/admin/admin-data.js?v=202610291533" defer></script>
  <script src="../js/admin/admin.js?v=202610291533" defer></script>
  <script src="../js/admin/products.js?v=202610291533" defer></script>
</head>
<body class="admin" data-module="products">
  <div class="admin-app">
    <aside class="admin-sidebar" id="admin-sidebar" aria-label="Admin menu"></aside>
    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>
      <main class="admin-content" id="main">
        <div class="admin-head">
          <div>
            <nav class="breadcrumb" aria-label="Breadcrumb">
              <a href="index.html">Dashboard</a><i class="hgi hgi-stroke hgi-arrow-right-01" aria-hidden="true"></i><span aria-current="page">Products</span>
            </nav>
            <h1>Products</h1>
          </div>
          <div class="head-actions">
            <button class="btn btn-outline" type="button" id="export-btn"><i class="hgi hgi-stroke hgi-download-01" aria-hidden="true"></i>Export CSV</button>
            <a class="btn btn-primary" href="product.html" data-manage><i class="hgi hgi-stroke hgi-add-01" aria-hidden="true"></i>Add product</a>
          </div>
        </div>

        <section class="card list-card" aria-label="Product list">
          <div class="list-toolbar">
            <div class="input-search">
              <i class="hgi hgi-stroke hgi-search-01" aria-hidden="true"></i>
              <label class="visually-hidden" for="p-q">Search products</label>
              <input class="input" id="p-q" type="search" placeholder="Search by name or tag" />
            </div>
            <div class="select">
              <label class="visually-hidden" for="p-cat">Category</label>
              <select id="p-cat"><option value="">All categories</option></select>
              <i class="hgi hgi-stroke hgi-arrow-down-01" aria-hidden="true"></i>
            </div>
            <div class="select">
              <label class="visually-hidden" for="p-sort">Sort</label>
              <select id="p-sort">
                <option value="newest">Newest first</option>
                <option value="name">Name A–Z</option>
                <option value="price-desc">Price: high to low</option>
                <option value="price-asc">Price: low to high</option>
                <option value="stock">Stock: low to high</option>
                <option value="sold">Best selling</option>
              </select>
              <i class="hgi hgi-stroke hgi-arrow-down-01" aria-hidden="true"></i>
            </div>
          </div>

          <div class="tabs" role="tablist" aria-label="Filter products" id="p-tabs">
            <button class="tab" type="button" role="tab" data-tab="all">All <span class="tab-count"></span></button>
            <button class="tab" type="button" role="tab" data-tab="published">Published <span class="tab-count"></span></button>
            <button class="tab" type="button" role="tab" data-tab="draft">Drafts <span class="tab-count"></span></button>
            <button class="tab" type="button" role="tab" data-tab="low">Low stock <span class="tab-count"></span></button>
            <button class="tab" type="button" role="tab" data-tab="out">Sold out <span class="tab-count"></span></button>
          </div>

          <div class="table-wrap"><table class="table" id="p-table"></table></div>
          <div class="list-empty" id="p-empty" hidden>
            <i class="hgi hgi-stroke hgi-package" aria-hidden="true"></i>
            <strong>No products match</strong>
            Try another search or filter.
          </div>
          <div class="pager" id="p-pager"></div>
        </section>

        <div class="bulk-bar" id="bulk" role="region" aria-label="Selected products" hidden>
          <span id="bulk-count"></span>
          <button type="button" data-bulk="publish"><i class="hgi hgi-stroke hgi-view" aria-hidden="true"></i>Publish</button>
          <button type="button" data-bulk="draft"><i class="hgi hgi-stroke hgi-view-off" aria-hidden="true"></i>Unpublish</button>
          <button type="button" class="is-danger" data-bulk="delete"><i class="hgi hgi-stroke hgi-delete-02" aria-hidden="true"></i>Delete</button>
          <button type="button" data-bulk-clear aria-label="Clear selection"><i class="hgi hgi-stroke hgi-cancel-01" aria-hidden="true"></i></button>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
